# Leitet HTTP und HTTPS (TLS am Gateway terminiert) für argocd.hs.local an den Argo-CD-Server-Service weiter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: apps
spec:
  parentRefs:
    - name: http-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - "www.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-svc
          port: 80
