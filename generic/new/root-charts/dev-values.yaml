environment: dev

defaults:
  project: dev

  finalizers:
    - resources-finalizer.argocd.argoproj.io

  annotations:
    notifications.argoproj.io/subscribe.on-sync-status.github: ""

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true

  syncOptions:
    - CreateNamespace=true

