# Stellt die Health-Bewertung für Applications wieder her, damit Sync-Waves des App-of-Apps-Musters auf Child-Apps warten.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    # Wendet die Health-Prüfung an, bevor Child-Applications in späteren Waves erstellt werden.
    argocd.argoproj.io/sync-wave: "-3"
data:
  # Eine Child-App gilt erst als bereit, wenn sie synchronisiert und ihre verwalteten Ressourcen fehlerfrei sind.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status == nil then
      return hs
    end
    if obj.status.operationState ~= nil and obj.status.operationState.phase == "Failed" then
      hs.status = "Degraded"
      hs.message = obj.status.operationState.message or "Child Application sync failed"
      return hs
    end
    if obj.status.sync ~= nil and obj.status.sync.status == "Synced" and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      hs.message = obj.status.health.message or ""
    end
    return hs
