# Installiert cert-manager und dessen CRDs im Namespace cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3-cert-manager
  namespace: argocd
  annotations:
    # Installiert cert-manager vor der Issuer-Application in der nächsten Wave.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  sources:
    - repoURL: oci://quay.io/jetstack/charts/cert-manager
      chart: cert-manager
      # Chart-Version; muss mit der Helm-Chart-Version übereinstimmen.
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/baseline/apps/cert-manager/values.yaml
    - repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Die Controller und der Webhook von cert-manager laufen in diesem Namespace.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Erstellt den Controller-Namespace und wendet CRDs serverseitig an.
      - CreateNamespace=true
      - ServerSideApply=true
