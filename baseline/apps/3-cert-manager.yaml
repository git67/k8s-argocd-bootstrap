# Installiert cert-manager und dessen CRDs im Namespace cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-cert-manager
  namespace: argocd
  annotations:
    # Installiert cert-manager vor der Issuer-Application in der nächsten Wave.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    chart: cert-manager
    # Chart-Version; muss mit der Helm-Chart-Version übereinstimmen.
    targetRevision: 1.19.2
    helm:
      parameters:
        # Installiert die cert-manager-API-Typen und behält sie bei, wenn das Chart entfernt wird.
        - name: crds.enabled
          value: "true"
        - name: crds.keep
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    # Die Controller und der Webhook von cert-manager laufen in diesem Namespace.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Erstellt den Controller-Namespace und wendet CRDs serverseitig an.
      - CreateNamespace=true
      - ServerSideApply=true
