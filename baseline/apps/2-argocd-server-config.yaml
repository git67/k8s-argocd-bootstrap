# Konfiguriert Argo CD für HTTP hinter dem clusterinternen Gateway und startet den Server neu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-argocd-server-config
  namespace: argocd
  annotations:
    # Wird nach Cilium angewendet und muss vor dem Erstellen der Argo-CD-HTTP-Route bereitstehen.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Dieses Verzeichnis enthält die ConfigMap, die Restart-RBAC mit minimalen Rechten und den PostSync-Job.
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps/argocd-server-config
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Die Argo-CD-Serverkonfiguration und Neustart-Ressourcen liegen in dessen Namespace.
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
