# Erstellt den Cilium-LoadBalancer-IP-Pool, die L2-Richtlinie und das gemeinsam genutzte HTTP-Gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 5-gateway
  namespace: argocd
  annotations:
    # Erstellt das Gateway vor allen HTTPRoute-Applications.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Enthält den IP-Pool, die L2-Announcement-Richtlinie und den Gateway-Listener.
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps/gateway
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Cilium-CRDs und Gateway werden aus dem Namespace kube-system installiert bzw. verwaltet.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
