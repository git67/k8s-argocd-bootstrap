# Minimale Überschreibungen für kube-prometheus-stack in der Monitoring-Baseline.
grafana:
  # Stellt Grafana bereit; vom Chart erzeugte Admin-Zugangsdaten werden in einem Kubernetes-Secret gespeichert.
  enabled: true
  # Initiales Grafana-Admin-Passwort; in gemeinsam genutzten oder produktiven Clustern stattdessen ein Secret verwenden.
  adminPassword: "password"
  service:
    # Nur innerhalb des Clusters erreichbar; externe Anfragen werden über das Gateway weitergeleitet.
    type: ClusterIP

prometheus:
  # Stellt Prometheus bereit.
  enabled: true

alertmanager:
  # Stellt Alertmanager bereit.
  enabled: true
