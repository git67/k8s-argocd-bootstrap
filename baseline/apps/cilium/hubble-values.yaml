# Aktiviert Hubble-Beobachtbarkeit, Relay, Oberfläche und die ausgewählten Flow-Metriken.
hubble:
  # Aktiviert die Erfassung von Hubble-Flows.
  enabled: true
  relay:
    # Stellt den Aggregationsdienst bereit, den die Oberfläche verwendet.
    enabled: true
  ui:
    # Stellt die Hubble-Weboberfläche bereit.
    enabled: true
  metrics:
    # Aus Hubble-Flows bereitgestellte Metriken; dies sind Metrikgruppen, keine Ports.
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2