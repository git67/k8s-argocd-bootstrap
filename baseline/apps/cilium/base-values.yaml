# Cilium chart settings for the Gateway API controller and bare-metal networking.
gatewayAPI:
  # Enable Cilium's Gateway API controller; required CRDs are installed separately.
  enabled: true
ipv4:
  # Enable IPv4 datapath and LoadBalancer address allocation.
  enabled: true
# Replace kube-proxy with Cilium's eBPF service handling.
kubeProxyReplacement: "true"
l2announcements:
  # Advertise LoadBalancer IPs on the selected node interface using L2.
  enabled: true
