# Cilium-Chart-Einstellungen für den Gateway-API-Controller und Bare-Metal-Netzwerke.
gatewayAPI:
  # Aktiviert Ciliums Gateway-API-Controller; die benötigten CRDs werden separat installiert.
  enabled: true
ipv4:
  # Aktiviert den IPv4-Datenpfad und die LoadBalancer-Adressvergabe.
  enabled: true
# Ersetzt kube-proxy durch Ciliums eBPF-Dienstverarbeitung.
kubeProxyReplacement: "true"
l2announcements:
  # Kündigt LoadBalancer-IP-Adressen über L2 auf der ausgewählten Node-Schnittstelle an.
  enabled: true
