# Installiert vor dem Start von Cilium die von Cilium 1.20 benötigten Gateway-API-CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 0-gateway-api-crds
  namespace: argocd
  annotations:
    # Erste Wave der Child-Apps; die Root-App installiert ihre Health-Prüfung in Wave -3.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Bindet die CRD-Definitionen aus dem Upstream auf die von Cilium 1.20 unterstützte Version fest.
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      # Behält die clusterweiten API-Definitionen bei, wenn diese Application entfernt wird.
      prune: false
      selfHeal: true
    syncOptions:
      # CRDs überschreiten die Größenbeschränkung für Annotationen bei clientseitigem Apply.
      - ServerSideApply=true
