# Gemeinsam genutzter, von Cilium verwalteter HTTP-Einstiegspunkt für die HTTPRoutes der Baseline.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gateway
  namespace: kube-system
  annotations:
    # Fordert die einzelne im Cilium-IP-Pool konfigurierte Adresse an.
    io.cilium/lb-ipam-ips: "192.168.56.200"
spec:
  # Cilium implementiert die Gateway API.
  gatewayClassName: cilium
  listeners:
    - name: http
      # Nur HTTP; der Self-Signed-Issuer wird erst mit einem TLS-Listener bzw. Zertifikat verwendet.
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Erlaubt HTTPRoutes aus argocd, kube-system und monitoring.
          from: All
