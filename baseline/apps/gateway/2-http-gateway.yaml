apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gateway
  namespace: kube-system
  annotations:
    # Sagt Cilium, welche IP für den LoadBalancer genutzt werden soll
    io.cilium/lb-ipam-ips: "192.168.56.200"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
