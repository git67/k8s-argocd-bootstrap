# Gemeinsam genutzter, von Cilium verwalteter HTTP-Einstiegspunkt für die HTTPRoutes der Baseline.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gateway
  namespace: kube-system
  annotations:
    # Fordert die einzelne im Cilium-IP-Pool konfigurierte Adresse an.
    io.cilium/lb-ipam-ips: "192.168.56.200"
spec:
  # Cilium implementiert die Gateway API.
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Erlaubt HTTPRoutes aus argocd, kube-system und monitoring.
          from: All
    - name: https-argocd
      # TLS wird am Gateway terminiert; das Zertifikat stammt aus 3-argocd-certificate.yaml.
      protocol: HTTPS
      port: 443
      hostname: argocd.hs.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-hs-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
