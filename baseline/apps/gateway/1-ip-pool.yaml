---
# Cluster-wide address pool and L2 advertisement policy for the Gateway Service.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ip-pool
spec:
  # The /32 reserves exactly the Gateway's LoadBalancer IP.
  blocks:
    - cidr: 192.168.56.200/32

---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-l2-policy
spec:
  # Select services of type LoadBalancer for L2 announcement.
  loadBalancerIPs: true
  # Node interface on the 192.168.56.0/24 network; must match the actual host NIC.
  interfaces:
    - ^enp0s3$
  # Apply only to Linux Kubernetes nodes.
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
