---
# Clusterweiter Adresspool und L2-Ankündigungsrichtlinie für den Gateway-Service.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ip-pool
spec:
  # Das /32 reserviert genau die LoadBalancer-IP des Gateways.
  blocks:
    - cidr: 192.168.56.200/32

---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-l2-policy
spec:
  # Wählt Services vom Typ LoadBalancer für die L2-Ankündigung aus.
  loadBalancerIPs: true
  # Netzwerkschnittstelle des Nodes im Netz 192.168.56.0/24; muss der tatsächlichen Host-Schnittstelle entsprechen.
  interfaces:
    - ^enp0s3$
  # Gilt nur für Linux-Kubernetes-Nodes.
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
