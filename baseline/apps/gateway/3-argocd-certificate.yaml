# Selbstsigniertes TLS-Zertifikat für argocd.hs.local, ausgestellt über den ClusterIssuer self-signed.
# Das Secret liegt im Namespace des Gateways, damit der HTTPS-Listener ohne ReferenceGrant darauf zugreifen kann.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-hs-local
  namespace: kube-system
spec:
  secretName: argocd-hs-local-tls
  commonName: argocd.hs.local
  dnsNames:
    - argocd.hs.local
  duration: 8760h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: self-signed
