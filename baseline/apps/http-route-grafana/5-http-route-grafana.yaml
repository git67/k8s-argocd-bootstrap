# Routes plain HTTP for grafana.hs.local to the Grafana Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: http-gateway
      # Gateway is shared and lives in kube-system.
      namespace: kube-system
  hostnames:
    - grafana.hs.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service name generated by the baseline-monitoring Helm release.
        - name: baseline-monitoring-grafana
          # Use the Service port (80), not the Grafana container port.
          port: 80
