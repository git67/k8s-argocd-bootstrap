# Leitet unverschlüsseltes HTTP für grafana.hs.local an den Grafana-Service weiter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: http-gateway
      # Das gemeinsam genutzte Gateway liegt in kube-system.
      namespace: kube-system
  hostnames:
    - grafana.hs.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service-Name, der vom Helm-Release baseline-monitoring erzeugt wird.
        - name: baseline-monitoring-grafana
          # Verwendet den Service-Port (80), nicht den Grafana-Container-Port.
          port: 80
