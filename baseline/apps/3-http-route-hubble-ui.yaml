apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-http-route-hubble-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps/http-route-hubble-ui
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true