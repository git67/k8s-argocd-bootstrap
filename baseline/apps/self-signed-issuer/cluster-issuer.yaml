# Clusterweiter Issuer zum Erstellen selbstsignierter Zertifikate.
# Er wird für eine Route erst verwendet, wenn ein Certificate oder TLS-Listener darauf verweist.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed
spec:
  # Verwendet die integrierte Self-Signed-Issuer-Implementierung von cert-manager.
  selfSigned: {}
