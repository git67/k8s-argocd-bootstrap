# Erstellt nach cert-manager und dessen CRDs den clusterweiten Self-Signed-Issuer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-self-signed-issuer
  namespace: argocd
  annotations:
    # Wartet, bis die cert-manager-Application fehlerfrei ist.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Enthält die ClusterIssuer-Ressource mit dem Namen "self-signed".
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps/self-signed-issuer
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # ClusterIssuer gilt clusterweit; der Ziel-Namespace wird darauf nicht angewendet.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
