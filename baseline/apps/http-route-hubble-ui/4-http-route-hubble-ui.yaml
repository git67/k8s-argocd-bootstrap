# Routes plain HTTP for hubble.hs.local to Cilium's Hubble UI Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: kube-system
spec:
  parentRefs:
    - name: http-gateway
      # Gateway is shared and lives in kube-system.
      namespace: kube-system
  hostnames:
    - "hubble.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          # Use the Service port (80), not the pod's target port.
          port: 80
