# Leitet unverschlüsseltes HTTP für hubble.hs.local an den Hubble-UI-Service von Cilium weiter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: kube-system
spec:
  parentRefs:
    - name: http-gateway
      # Das gemeinsam genutzte Gateway liegt in kube-system.
      namespace: kube-system
  hostnames:
    - "hubble.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          # Verwendet den Service-Port (80), nicht den Ziel-Port des Pods.
          port: 80
