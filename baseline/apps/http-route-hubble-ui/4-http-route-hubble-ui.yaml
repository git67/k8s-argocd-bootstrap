apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: kube-system
spec:
  parentRefs:
    - name: http-gateway
      namespace: kube-system
  hostnames:
    - "hubble.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80 # Service hubble-ui: 80 -> 8081 (Frontend)
