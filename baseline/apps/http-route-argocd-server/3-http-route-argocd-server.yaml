# Leitet HTTPS für argocd.hs.local an den Argo-CD-Server-Service weiter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: http-gateway
      namespace: kube-system
      # TLS wird am Gateway terminiert; der interne Argo-CD-Server verwendet HTTP.
      sectionName: https-argocd
  hostnames:
    - "argocd.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          # Service-Port 80 wird mit server.insecure=true aus der Konfigurations-Application verwendet.
          port: 80
