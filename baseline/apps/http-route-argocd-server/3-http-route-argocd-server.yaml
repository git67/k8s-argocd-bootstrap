# Routes plain HTTP for argocd.hs.local to the Argo CD server Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: http-gateway
      # Gateway is shared and lives in kube-system.
      namespace: kube-system
  hostnames:
    - "argocd.hs.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          # Service port 80 is used with server.insecure=true in the config app.
          port: 80
