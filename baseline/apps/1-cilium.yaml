# Installiert Cilium und aktiviert dessen Gateway-API- und Hubble-Controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    # Wartet, bis die Gateway-API-CRD-Application fehlerfrei ist.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      # Legt die Cilium-Chart-Version explizit fest, damit die Cluster-Netzwerkkonfiguration reproduzierbar bleibt.
      targetRevision: 1.20.3
      helm:
        releaseName: cilium
        valueFiles:
          - $values/baseline/apps/cilium/base-values.yaml
          - $values/baseline/apps/cilium/hubble-values.yaml
    - repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      # Cilium erzeugt große CRDs, die sicherer serverseitig angewendet werden.
      - ServerSideApply=true
