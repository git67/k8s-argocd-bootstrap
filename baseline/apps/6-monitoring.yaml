# Installiert Prometheus, Alertmanager und Grafana mithilfe von kube-prometheus-stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-monitoring
  namespace: argocd
  annotations:
    # Installiert Grafana vor dessen Route und nach den grundlegenden Netzwerk-Applications.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # Helm-Chart-Version; die Values-Datei aktiviert Grafana, Prometheus und Alertmanager.
      targetRevision: 92.11.0
      helm:
        releaseName: baseline-monitoring
        valueFiles:
          - $values/baseline/apps/monitoring/values.yaml
    - repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Monitoring-Komponenten und der Grafana-Service werden hier installiert.
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
