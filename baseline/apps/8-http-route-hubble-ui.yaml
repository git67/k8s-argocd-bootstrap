# Stellt die Hubble-Oberfläche unter hubble.hs.local über das gemeinsam genutzte Gateway bereit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-http-route-hubble-ui
  namespace: argocd
  annotations:
    # Wave der Route-Application: Cilium, Gateway-API-CRDs und das gemeinsam genutzte Gateway sind Voraussetzungen.
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Enthält die HTTPRoute für den Hubble-UI-Service.
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps/http-route-hubble-ui
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Die Hubble-Oberfläche wird von Cilium im Namespace kube-system installiert.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
