# Argo-CD-Servereinstellung: intern HTTP verwenden, da das Gateway den Service-Port 80 nutzt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  # Am Gateway ist keine TLS-Terminierung eingerichtet; diese Einstellung darf nicht außerhalb des vertrauenswürdigen Netzwerks bereitgestellt werden.
  server.insecure: "true"
