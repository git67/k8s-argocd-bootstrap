---
# ServiceAccount, der ausschließlich vom PostSync-Job zum Neustart von argocd-server verwendet wird.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server-restart
  namespace: argocd
---
# Auf den Namespace beschränkte Berechtigung, ausschließlich das argocd-server-Deployment zu lesen und zu ändern.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server-restart
  namespace: argocd
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - argocd-server
    # kubectl verwendet get; patch aktualisiert die Annotation für den Rollout-Neustart.
    verbs:
      - get
      - patch
---
# Bindet die Neustart-Rolle ausschließlich an den dafür vorgesehenen Neustart-ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-restart
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argocd-server-restart
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server-restart
