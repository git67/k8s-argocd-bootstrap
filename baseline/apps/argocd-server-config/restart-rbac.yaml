apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server-restart
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server-restart
  namespace: argocd
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - argocd-server
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-restart
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argocd-server-restart
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server-restart
