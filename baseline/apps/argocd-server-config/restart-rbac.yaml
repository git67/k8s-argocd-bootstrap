---
# Service account used only by the PostSync job that restarts argocd-server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server-restart
  namespace: argocd
---
# Namespace-scoped permission to read and patch only the argocd-server Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server-restart
  namespace: argocd
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - argocd-server
    # get is used by kubectl; patch performs the rollout-restart annotation update.
    verbs:
      - get
      - patch
---
# Binds the restart Role only to the dedicated restart ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-restart
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argocd-server-restart
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server-restart
