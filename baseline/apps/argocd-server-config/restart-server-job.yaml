---
# Startet argocd-server nach der ConfigMap-Änderung neu, damit server.insecure wirksam wird.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-server-restart
  namespace: argocd
  annotations:
    # Wird nach der Synchronisierung ausgeführt; ersetzt vorherige Hooks und löscht erfolgreiche Jobs.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # Wiederholt vorübergehende kubectl-Fehler dreimal und begrenzt die Laufzeit des Jobs auf zwei Minuten.
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: argocd-server-restart
      restartPolicy: Never
      containers:
        - name: restart
          # Bindet kubectl an die Kubernetes-Nebenversion des Clusters.
          image: registry.k8s.io/kubectl:v1.34.0
          command:
            - kubectl
          args:
            # Startet ausschließlich das Argo-CD-Server-Deployment in dessen Namespace neu.
            - -n
            - argocd
            - rollout
            - restart
            - deployment/argocd-server
