---
# Root app-of-apps: discovers and manages all Application manifests in baseline/apps.
# A managed argocd-cm health check lets sync waves wait for child apps to sync and become healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: start-baseline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Git repository, directory containing child Applications, and tracked revision.
    repoURL: https://github.com/git67/k8s-argocd-bootstrap.git
    path: baseline/apps
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    # Child Application objects are created in the Argo CD control namespace.
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
